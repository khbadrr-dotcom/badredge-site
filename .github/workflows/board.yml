name: Refresh market board
on:
  schedule:
    - cron: "7 * * * 0-5"   # hourly, Sun-Fri (UTC)
  workflow_dispatch:
permissions:
  contents: write
concurrency: board
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 _src/refresh_board.py
      - run: PYTHONDONTWRITEBYTECODE=1 python3 _src/build.py
      - name: Commit if changed
        run: |
          git config user.name "badredge-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _src/board_data.json index.html
          git diff --cached --quiet && exit 0
          git commit -m "Board: hourly data refresh"
          git push
