<!doctype html>
<!-- Share-card template (1200x630). Rendered to assets/og-*.jpg by _src/og/render.js.
     Query: ?h=headline&g=gold-part&s=subline&e=eyebrow -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #07080a; }
  body { position: relative; font-family: Manrope, system-ui, sans-serif; color: #f2ede4; }
  .glow { position: absolute; inset: 0; background:
      radial-gradient(520px 320px at 50% 30%, rgba(217,180,108,.20), transparent 70%),
      radial-gradient(700px 260px at 15% 105%, rgba(79,184,160,.12), transparent 70%),
      radial-gradient(700px 260px at 90% 0%, rgba(217,180,108,.08), transparent 70%); }
  svg.sky { position: absolute; inset: 0; }
  .sky .orb { fill: none; stroke: rgba(217,180,108,.28); stroke-width: 1.2; }
  .sky .orb.f { stroke: rgba(217,180,108,.16); stroke-dasharray: 2 6; }
  .sky .star { fill: #fff; }
  .moon { position: absolute; left: 50%; top: 46px; width: 300px; height: 300px; margin-left: -150px;
          filter: drop-shadow(0 0 60px rgba(217,180,108,.35)) drop-shadow(0 0 140px rgba(217,180,108,.15)); }
  .tk { position: absolute; width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center;
        font: 500 14px 'IBM Plex Mono', monospace; color: #f3deb0; background: rgba(12,12,14,.85);
        box-shadow: 0 0 0 1.5px rgba(217,180,108,.55), 0 0 18px rgba(217,180,108,.18); }
  .cdl { position: absolute; width: 14px; }
  .cdl i { position: absolute; left: 6.25px; width: 1.5px; top: 0; bottom: 0; background: currentColor; }
  .cdl b { position: absolute; left: 0; right: 0; border-radius: 2px; background: currentColor; box-shadow: 0 0 16px currentColor; }
  .up { color: #4fb8a0; } .dn { color: #e07a6c; }
  .copy { position: absolute; left: 0; right: 0; top: 372px; text-align: center; }
  .brand { display: inline-flex; align-items: center; gap: 14px; font-weight: 600; font-size: 22px; letter-spacing: .32em; }
  .brand .m { width: 26px; height: 26px; border-radius: 50%; background: url(../../assets/moon.webp) center/cover; box-shadow: 0 0 12px rgba(217,180,108,.4); }
  .brand .g { color: #d9b46c; }
  h1 { margin-top: 22px; font-size: 60px; font-weight: 700; letter-spacing: -.025em; line-height: 1.05; }
  h1 span { color: #d9b46c; }
  .eb { margin-top: 18px; font: 500 15px 'IBM Plex Mono', monospace; letter-spacing: .16em; text-transform: uppercase; color: #4fb8a0; }
  .eb::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 12px; vertical-align: 2px; background: #4fb8a0; transform: rotate(45deg); }
  .sub { margin-top: 8px; font-size: 22px; color: #a6a39c; }
  .url { position: absolute; right: 40px; bottom: 30px; font: 500 15px 'IBM Plex Mono', monospace; letter-spacing: .08em; color: #8b8780; }
  .free { position: absolute; left: 40px; bottom: 30px; font: 500 15px 'IBM Plex Mono', monospace; letter-spacing: .08em; color: #8b8780; }
</style></head>
<body>
<div class="glow"></div>
<svg class="sky" viewBox="0 0 1200 630">
  <g id="stars"></g>
  <ellipse class="orb f" cx="600" cy="196" rx="560" ry="120" transform="rotate(-6 600 196)"/>
  <ellipse class="orb" cx="600" cy="196" rx="300" ry="78" transform="rotate(-12 600 196)"/>
  <ellipse class="orb" cx="600" cy="196" rx="236" ry="60" transform="rotate(16 600 196)"/>
</svg>
<img class="moon" src="../../assets/moon.webp" alt="">
<span class="tk" style="left:282px;top:118px">NQ</span>
<span class="tk" style="left:868px;top:150px">GC</span>
<span class="tk" style="left:408px;top:286px">ES</span>
<span class="cdl up" style="left:842px;top:236px;height:58px"><i></i><b style="top:12px;bottom:14px"></b></span>
<span class="cdl dn" style="left:350px;top:200px;height:48px"><i></i><b style="top:10px;bottom:12px"></b></span>
<div class="copy">
  <div class="brand"><span class="m"></span><span>BADR <span class="g">EDGE</span></span></div>
  <h1 id="h"></h1>
  <div class="eb" id="e"></div>
</div>
<div class="free">FREE · NO SIGN-UP</div>
<div class="url">badredge.com</div>
<script>
  const q = new URLSearchParams(location.search);
  const h = q.get('h') || 'Patience is', g = q.get('g') || 'a position.';
  document.getElementById('h').innerHTML = h + ' <span>' + g + '</span>';
  document.getElementById('e').textContent = q.get('e') || 'Day trader toolkit';
  let s = 7, r = () => (s = (s * 9301 + 49297) % 233280) / 233280, out = '';
  for (let i = 0; i < 90; i++) out += `<circle class="star" cx="${(r()*1200).toFixed(1)}" cy="${(r()*630).toFixed(1)}" r="${(r()*1.1+.3).toFixed(2)}" opacity="${(r()*.5+.15).toFixed(2)}"/>`;
  document.getElementById('stars').innerHTML = out;
</script>
</body></html>
